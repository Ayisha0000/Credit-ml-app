[project]
name = "credit_scoring_project"
version = "0.1.0"
description = "Repayment-aware ML credit scoring with early & late payment intelligence"
readme = "README.md"
requires-python = ">=3.10"
authors = [ { name = "Data Science Team" } ]
dependencies = [
    "pandas==2.2.0",
    "numpy==1.26.4",
    "scikit-learn==1.4.0",
    "matplotlib==3.8.2",
    "seaborn==0.13.2",
    "xgboost==2.0.3",
    "joblib==1.3.2",
    "scipy==1.12.0",
    "reportlab==4.1.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
